<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Acorn</title>
    <script src="/theme-boot.js"></script>
    <style>
      @font-face {
        font-family: "Source Sans 3";
        font-style: normal;
        font-weight: 400 600;
        font-display: swap;
        src: url("/fonts/source-sans.woff2") format("woff2");
      }
      html, body, #root {
        background: transparent !important;
        background-color: transparent !important;
      }
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f3eadc;
      }
      .boot-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      body:has(#root:not(:empty)) #boot-splash {
        display: none;
      }
      html.dark #boot-splash {
        background: #2c2118;
      }
      .boot-splash-mark {
        position: relative;
        width: 3rem;
        filter: drop-shadow(0 10px 24px rgba(0, 0, 0, 0.1));
      }
      html.dark .boot-splash-mark {
        filter: drop-shadow(0 12px 28px rgba(0, 0, 0, 0.45));
      }
      .boot-splash-mark svg {
        display: block;
        width: 100%;
        height: auto;
      }
      .boot-splash-base {
        color: rgb(26 21 16 / 0.2);
      }
      html.dark .boot-splash-base {
        color: rgb(247 241 230 / 0.2);
      }
      .boot-splash-highlight {
        position: absolute;
        inset: 0;
        color: rgb(26 21 16 / 0.75);
        -webkit-mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        mask-image: linear-gradient(
          105deg,
          transparent 36%,
          #000 50%,
          transparent 64%
        );
        -webkit-mask-size: 220% 100%;
        mask-size: 220% 100%;
        animation: boot-splash-shimmer 2.4s ease-in-out infinite;
      }
      html.dark .boot-splash-highlight {
        color: rgb(247 241 230 / 0.5);
      }
      .boot-splash-detail {
        max-width: 16rem;
        margin: 1.25rem 0 0;
        color: #5c5348;
        font-family:
          "Source Sans 3", ui-sans-serif, system-ui, sans-serif;
        font-size: 0.75rem;
        line-height: 1rem;
        text-align: center;
        opacity: 0;
        animation: boot-splash-detail-reveal 0s linear 2s forwards;
      }
      html.dark .boot-splash-detail {
        color: #cfc3b0;
      }
      @keyframes boot-splash-shimmer {
        0% {
          -webkit-mask-position: 120% 0%;
          mask-position: 120% 0%;
        }
        100% {
          -webkit-mask-position: -20% 0%;
          mask-position: -20% 0%;
        }
      }
      @keyframes boot-splash-detail-reveal {
        to {
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-splash-highlight {
          animation: none;
          opacity: 0;
        }
      }
    </style>
    <script src="/relay-shim.js"></script>
  </head>
  <body spellcheck="false">
    <div id="boot-splash" data-tauri-drag-region aria-hidden="true">
      <div class="boot-splash-content">
        <div class="boot-splash-mark">
          <svg
            class="boot-splash-base"
            viewBox="0 0 32 32"
            fill="currentColor"
            aria-hidden="true"
          >
            <path
              d="M16.35 4.1c.2 1.7 0 3-.7 4.05 3.55.2 6.7 1.7 6.7 3.9 0 1.7-2 2.85-4.85 3.3.4.2.7.55.7.95 0 .2-.1.4-.3.6 3.05.35 5.4 2.75 5.4 6.55 0 4.65-3.4 9-7.4 9s-7.4-4.35-7.4-9c0-3.8 2.35-6.2 5.4-6.55-.2-.2-.3-.4-.3-.6 0-.4.3-.75.7-.95-2.85-.45-4.85-1.6-4.85-3.3 0-2.2 3.15-3.7 6.7-3.9-.7-1.05-.85-2.35-.7-4.05.05-.4.7-.4.8 0z"
            />
          </svg>
          <div class="boot-splash-highlight" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="currentColor">
              <path
                d="M16.35 4.1c.2 1.7 0 3-.7 4.05 3.55.2 6.7 1.7 6.7 3.9 0 1.7-2 2.85-4.85 3.3.4.2.7.55.7.95 0 .2-.1.4-.3.6 3.05.35 5.4 2.75 5.4 6.55 0 4.65-3.4 9-7.4 9s-7.4-4.35-7.4-9c0-3.8 2.35-6.2 5.4-6.55-.2-.2-.3-.4-.3-.6 0-.4.3-.75.7-.95-2.85-.45-4.85-1.6-4.85-3.3 0-2.2 3.15-3.7 6.7-3.9-.7-1.05-.85-2.35-.7-4.05.05-.4.7-.4.8 0z"
              />
            </svg>
          </div>
        </div>
        <p class="boot-splash-detail">
          Loading Acorn. This is taking longer than expected.
        </p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
